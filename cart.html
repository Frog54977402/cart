<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>购物车</title>
<style>
  :root{
    --jd-red:#e63946; --jd-orange:#ffad3d; --jd-bg:#f5f5f5; --card:#ffffff;
    --text:#111; --sub:#999; --border:#eee; --accent:#e2231a;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--jd-bg); color:var(--text);
    -webkit-text-size-adjust:100%;
  }
  /* 固定头部 */
  .topbar{
    position:fixed; top:0; left:0; right:0; z-index:20; height:52px;
    background:linear-gradient(90deg,#ff5a5f,#ff4b4b 45%,#e2231a);
    color:#fff; display:flex; align-items:center; padding:0 12px;
    box-shadow:0 1px 4px rgba(0,0,0,.12);
  }
  .topbar .title{ font-size:17px; font-weight:600; letter-spacing:1px; }

  .page{
    padding-top:52px;
    padding-bottom:74px; /* 底部结算栏占位 */
    max-width:420px; margin:0 auto;
  }

  /* 商品卡片 */
  .card{
    background:var(--card); margin:10px 10px 0; border-radius:12px;
    padding:10px 10px 8px; box-shadow:0 1px 3px rgba(0,0,0,.05);
    display:flex; align-items:center; gap:10px;
  }
  .card-main{ flex:1; min-width:0; }
  /* 卡片最左端缩略图 */
  .thumb{
    width:48px; height:48px; flex-shrink:0; border-radius:8px; overflow:hidden;
    background:#f2f2f2; display:flex; align-items:center; justify-content:center;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .thumb .ph{ font-size:20px; font-weight:700; color:#bbb; }
  .card-head{ display:flex; align-items:center; }
  .check{
    width:20px; height:20px; border-radius:50%; border:2px solid #ccc;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s; margin-right:8px;
  }
  .check.on{ background:var(--accent); border-color:var(--accent); }
  .check.on::after{ content:""; width:10px; height:5px; border-left:2px solid #fff; border-bottom:2px solid #fff; transform:rotate(-45deg) translateY(-1px); }
  .check.all{ border-radius:4px; }
  .name{ flex:1; font-size:15px; font-weight:700; color:#111; line-height:1.35; }
  .name-small{ font-size:12px; font-weight:400; color:var(--sub); margin-left:6px; }

  /* 单价行 */
  .price-row{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .price-row .p{ font-size:14px; color:#333; }
  .price-row .p b{ color:var(--accent); font-size:17px; }
  .price-row .p .curr{ font-style:normal; font-size:12px; color:var(--accent); }
  .price-row .u{ font-size:12px; color:var(--sub); margin-left:8px; }
  .qty{ display:flex; align-items:center; gap:6px; }
  .qty button{
    width:28px; height:28px; border-radius:6px; border:1px solid #ccc;
    background:#fff; color:#333; font-size:18px; line-height:1; cursor:pointer;
  }
  .qty button:active{ background:#eee; }
  .qty span{ min-width:32px; text-align:center; font-size:16px; font-weight:600; }

  /* 优惠描述（红字） */
  .promo{ margin-top:6px; font-size:12px; color:var(--accent); }
  .promo.off{ color:var(--sub); } /* 未达到件数时灰字标记 */
  .promo line{ display:flex; justify-content:space-between; align-items:center; }

  /* 结算栏 */
  .bar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:#fff; border-top:1px solid var(--border);
    display:flex; align-items:center; padding:8px 12px;
    max-width:420px; margin:0 auto;
  }
  .bar .all{ display:flex; align-items:center; }
  .bar .sum{ flex:1; text-align:right; font-size:12px; color:#666; line-height:1.2; margin-right:10px; }
  .bar .sum b{ display:block; color:var(--accent); font-size:20px; font-weight:700; }
  .bar .sum b .curr{ font-style:normal; font-size:12px; }
  .settle{
    background:linear-gradient(90deg,#ff5a5f,#e2231a);
    color:#fff; border:none; border-radius:20px; padding:10px 26px;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .settle:disabled{ background:#ccc; cursor:not-allowed; }

  /* 遮罩 + 结算卡片弹窗 */
  .mask{
    position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30;
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  .mask.show{ display:flex; }
  .sheet{
    width:100%; max-width:340px; background:#fff; border-radius:16px;
    padding:22px 18px 18px; text-align:center;
    animation:pop .18s ease-out;
  }
  @keyframes pop{ from{ transform:scale(.92); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .sheet h3{ font-size:16px; font-weight:700; color:#111; margin-bottom:4px; }
  .sheet .tip{ font-size:12px; color:var(--sub); margin-bottom:14px; }
  .sheet .amount{ color:var(--accent); font-size:38px; font-weight:800; line-height:1; }
  .sheet .amount .curr{ font-style:normal; font-size:16px; }
  .sheet .items{ max-height:34vh; overflow:auto; margin:14px 0; text-align:left; }
  .sheet .row{ display:flex; justify-content:space-between; font-size:13px; color:#555; padding:5px 2px; border-bottom:1px dashed #f0f0f0; }
  .sheet .row span:first-child{ max-width:62%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
  .sheet .row .off{ color:var(--accent); }
  .pay-btn{
    width:100%; background:linear-gradient(90deg,#ff5a5f,#e2231a);
    color:#fff; border:none; border-radius:24px; padding:12px 0;
    font-size:16px; font-weight:700; cursor:pointer; margin-top:6px;
  }
  .cancel{
    width:100%; margin-top:8px; padding:10px 0; border:none; border-radius:24px;
    background:#f2f2f2; color:#666; font-size:14px; cursor:pointer;
  }
  .empty{ padding:40px 0; text-align:center; color:#999; font-size:14px; }
  .toast{
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.78); color:#fff; font-size:13px; padding:8px 16px;
    border-radius:18px; z-index:40; display:none; white-space:nowrap;
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="title">购物车</div>
</div>

<div class="page" id="page"></div>

<div class="bar" id="bar">
  <div class="all" id="checkAll"><div class="check all" id="checkAllBox"></div><span style="font-size:13px;margin-left:6px;">全选</span></div>
  <div class="sum"><span>已选</span><b id="sumBig">¥0.00</b></div>
  <button class="settle" id="settleBtn">结算(0)</button>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <h3>确认结算</h3>
    <div class="tip">请记住金额后前往支付</div>
    <div class="amount"><span class="curr">¥</span><span id="payAmount">0.00</span></div>
    <div class="items" id="payItems"></div>
    <button class="pay-btn" id="payBtn">去支付</button>
    <button class="cancel" id="cancelBtn">再想想</button>
  </div>
</div>
<div class="toast" id="toast"></div>

 *     折后单价 = roundHalfUp(单价分 × bps ÷ 100) = floor((单价分 × bps + 50) / 100)；
 *  3. 行金额 = 折后单价（或原价）× 数量，显示值 = 计算值，一分不差；
 *  4. 结算 = Σ 已勾选行金额，JS 与 App(Kotlin) 使用同一条公式，双端用例镜像覆盖。
 */

/** 数据归一化：任何脏数据（越界/缺省/null）都会落到安全语义，杜绝 NaN/负数/超界。 */
function normalizeProduct(p) {
  if (!p || typeof p !== 'object') p = {};
  var priceFen = isFiniteNumber(p.priceFen) ? Math.max(0, Math.floor(p.priceFen)) : 0;
  var count = isFiniteNumber(p.count) ? Math.max(0, Math.floor(p.count)) : 0;
  // step: 达到多少件触发折扣；<=0 表示“不打折”
  var step = isFiniteNumber(p.step) ? Math.max(0, Math.floor(p.step)) : 0;
  var discountBps = isFiniteNumber(p.discountBps) ? Math.max(0, Math.min(100, Math.floor(p.discountBps))) : 100;
  return {
    priceFen: priceFen,
    count: count,
    step: step,
    discountBps: discountBps,
    // 折扣是否生效：step>0 且 数量 >= step
    on: step > 0 && count >= step
  };
}

function isFiniteNumber(v) {
  return typeof v === 'number' && isFinite(v);
}

/** 商品所属折扣组的键：step 与 discountBps 完全相同才同组；不打折(step<=0 / bps>=100)不成组。 */
function groupKey(n) {
  if (n.step > 0 && n.discountBps < 100) return n.step + ':' + n.discountBps;
  return null;
}

/**
 * 按「共用优惠」规则计算一组商品每行。
 * 规则：折扣条件（step+折扣）完全相同的商品视为同一组、件数相加；组内达标时，
 *       **把整组视为一个商品**，用「组内总价 × 折扣」算出组优惠总价（整数分，四舍五入），
 *       再按累计法分摊到各行 —— 保证「Σ 各行金额 === 组优惠总价」，一分不差。
 * 约束：传入的 items 必须是本次结算范围内的商品（即已勾选集合），保证“没买的商品不影响结算价”。
 */
function computeLines(items) {
  var list = (items || []).map(normalizeProduct);
  // 默认：不达标，按原价
  var lines = list.map(function (n) {
    return {
      priceFen: n.priceFen, count: n.count, step: n.step,
      discountBps: n.discountBps, groupCount: n.count,
      on: false, unitFen: n.priceFen, lineFen: n.priceFen * n.count
    };
  });
  // 按折扣条件分组（step:bps 相同才同组）
  var groups = {};
  list.forEach(function (n, i) {
    var k = groupKey(n);
    if (k) { (groups[k] = groups[k] || []).push(i); }
  });
  Object.keys(groups).forEach(function (k) {
    var idxs = groups[k];
    var first = list[idxs[0]];
    var totalCount = 0, totalRaw = 0;
    idxs.forEach(function (i) { totalCount += list[i].count; totalRaw += list[i].priceFen * list[i].count; });
    var on = totalCount > 0 && totalCount >= first.step;
    idxs.forEach(function (i) { lines[i].groupCount = totalCount; lines[i].on = on; });
    if (!on) return;
    // 累计分摊：第 i 行金额 = 累计折后额(到第 i 行) - 累计折后额(到第 i-1 行)
    // Σ = 最后一行的累计折后额 = floor((组总价 × 折扣 + 50) / 100) = 组优惠总价（严格）
    var acc = 0, prev = 0;
    idxs.forEach(function (i) {
      acc += list[i].priceFen * list[i].count;
      var cum = Math.floor((acc * first.discountBps + 50) / 100);
      lines[i].lineFen = cum - prev;
      prev = cum;
      lines[i].unitFen = list[i].count > 0
        ? Math.round(lines[i].lineFen / list[i].count)
        : list[i].priceFen;
    });
  });
  return lines;
}

/** 当前生效的单价（分）。单商品语义：等价于“组内只有它自己”。 */
function unitFen(p) {
  var n = normalizeProduct(p);
  if (!n.on) return n.priceFen;
  return Math.floor((n.priceFen * n.discountBps + 50) / 100);
}

/** 单件商品行金额（分）。单商品语义。 */
function lineFen(p) {
  var n = normalizeProduct(p);
  return unitFen(n) * n.count;
}

/** 结算合计（分）= Σ 各行的「共用优惠」金额（传入 items 即已勾选集合）。 */
function totalFen(items) {
  return computeLines(items).reduce(function (sum, l) { return sum + l.lineFen; }, 0);
}

/** 分 -> "x.xx" 字符串，纯整数拼装，不经浮点。 */
function formatFen(fen) {
  fen = Math.max(0, Math.floor(Number(fen) || 0));
  var yuan = Math.floor(fen / 100);
  var cents = fen % 100;
  return yuan + '.' + (cents < 10 ? '0' + cents : cents);
}

/** 折扣基点 -> 人类可读的“x.x折”字符串（100=“原价”）。 */
function formatDiscount(bps) {
  bps = Math.max(0, Math.min(100, Math.floor(Number(bps) || 0)));
  if (bps >= 100) return '原价';
  var z = Math.floor(bps / 10);
  var r = bps % 10;
  return r === 0 ? z + '折' : z + '.' + r + '折';
}

// CommonJS（Node 测试）导出
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { normalizeProduct: normalizeProduct, unitFen: unitFen, lineFen: lineFen, totalFen: totalFen, computeLines: computeLines, formatFen: formatFen, formatDiscount: formatDiscount };
} else {
  // 浏览器环境：挂到全局，供页面脚本调用（之前漏了这条，导致浏览器里 CartLogic 未定义、页面崩溃空白）
  if (typeof window !== 'undefined') {
    window.CartLogic = { normalizeProduct: normalizeProduct, unitFen: unitFen, lineFen: lineFen, totalFen: totalFen, computeLines: computeLines, formatFen: formatFen, formatDiscount: formatDiscount };
  }
}
</script>
<script>
(function () {
  'use strict';
  // 双格式兜底：对象 {items:[...]} 或纯数组 [...] 都能识别，绝不让页面因数据格式而空白
  var raw = window.CART_DATA;
  var items = (raw && Array.isArray(raw)) ? raw : (raw && Array.isArray(raw.items) ? raw.items : []);
  var selected = {};            // id -> true
  var uid = 1;

  var el = {
    page: document.getElementById('page'),
    settle: document.getElementById('settleBtn'),
    sumBig: document.getElementById('sumBig'),
    checkAll: document.getElementById('checkAll'),
    checkAllBox: document.getElementById('checkAllBox'),
    mask: document.getElementById('mask'),
    payAmount: document.getElementById('payAmount'),
    payItems: document.getElementById('payItems'),
    payBtn: document.getElementById('payBtn'),
    cancel: document.getElementById('cancelBtn'),
    toast: document.getElementById('toast')
  };

  function normNum(v, dflt) { var n = Number(v); return isFinite(n) ? n : dflt; }

  // 参与结算的有效集合 = 已勾选 且 数量>0（数量为 0 的不计入结算，即便勾选）
  function payable() {
    return items.filter(function (it) {
      return selected[it.id] && normNum(it.count, 0) > 0;
    });
  }

  // ---------- 渲染 ----------
  function render() {
    var html = '';
    if (items.length === 0) {
      html = '<div class="empty">购物车是空的</div>';
    } else {
      // 共用优惠只在“结算范围内”生效：按已勾选商品分组凑件
      var checked = payable();
      var lines = CartLogic.computeLines(checked);
      var lineById = {};
      checked.forEach(function (it, i) { lineById[it.id] = lines[i]; });

      items.forEach(function (it, i) {
        var n = CartLogic.normalizeProduct(it);
        var line = lineById[it.id];               // 未勾选则为 undefined → 按原价展示
        var unit = line ? line.unitFen : n.priceFen;
        var promo = makePromo(n, line);
        html +=
          '<div class="card" data-i="' + i + '">' +
            makeThumb(it) +
            '<div class="card-main">' +
              '<div class="card-head">' +
                '<div class="check' + (selected[it.id] ? ' on' : '') + '" data-act="check" data-id="' + it.id + '"></div>' +
                '<div class="name">' + esc(it.name || '未命名商品') + (it.spec ? '<span class="name-small">' + esc(it.spec) + '</span>' : '') + '</div>' +
              '</div>' +
              '<div class="price-row">' +
                '<div class="p"><span class="curr">¥</span><b>' + esc(CartLogic.formatFen(unit)) + '</b><span class="u">单价</span></div>' +
                '<div class="qty">' +
                  '<button data-act="dec" data-id="' + it.id + '">−</button>' +
                  '<span>' + n.count + '</span>' +
                  '<button data-act="inc" data-id="' + it.id + '">+</button>' +
                '</div>' +
              '</div>' +
              promo +
            '</div>' +
          '</div>';
      });
    }
    el.page.innerHTML = html;
    updateBar();
  }

  /** 卡片左端缩略图：有 base64 图（it.img）则显示，否则用名称首字占位。 */
  function makeThumb(it) {
    if (it.img) {
      return '<div class="thumb"><img src="' + it.img + '" alt=""></div>';
    }
    var ch = (it.name || '?').trim().charAt(0) || '?';
    return '<div class="thumb"><span class="ph">' + esc(ch) + '</span></div>';
  }

  /** 优惠行：line 为「共用优惠」计算结果（未勾选时为 undefined）。 */
  function makePromo(n, line) {
    if (n.step > 0 && n.discountBps < 100) {
      var label = CartLogic.formatDiscount(n.discountBps);
      var on = !!(line && line.on);
      var reduce = on ? (n.priceFen * n.count - line.lineFen) : 0;
      return '<div class="promo' + (on ? '' : ' off') + '"><line>' +
        '<span>' + (on ? '已优惠' : '满' + n.step + '件') + '：' + n.step + '件' + label + '</span>' +
        '<span class="amt">' + (on ? '立减 ¥' + CartLogic.formatFen(reduce) : '') + '</span>' +
        '</line></div>';
    }
    return '<div class="promo off"><line><span>暂无优惠</span></line></div>';
  }

  function updateBar() {
    var checked = payable();
    var total = CartLogic.totalFen(checked);
    el.sumBig.innerHTML = '<span class="curr">¥</span>' + CartLogic.formatFen(total);
    el.settle.textContent = '结算(' + checked.length + ')';
    el.settle.disabled = checked.length === 0;
    var allOn = items.length > 0 && items.every(function (it) { return selected[it.id]; });
    el.checkAllBox.className = 'check all' + (allOn ? ' on' : '');
  }

  // ---------- 事件 ----------
  el.page.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var id = t.getAttribute('data-id');
    var act = t.getAttribute('data-act');
    var i = items.findIndex(function (it) { return it.id === id; });
    if (i < 0) return;
    if (act === 'check') selected[id] = !selected[id];
    else if (act === 'inc') { items[i].count = normNum(items[i].count, 0) + 1; selected[id] = true; }
    else if (act === 'dec') {
      items[i].count = Math.max(0, normNum(items[i].count, 0) - 1);
    }
    render();
  });

  el.checkAll.addEventListener('click', function () {
    var allOn = items.length > 0 && items.every(function (it) { return selected[it.id]; });
    items.forEach(function (it) { selected[it.id] = !allOn; });
    render();
  });

  el.settle.addEventListener('click', openSheet);
  el.cancel.addEventListener('click', closeSheet);
  el.mask.addEventListener('click', function (e) { if (e.target === el.mask) closeSheet(); });

  el.payBtn.addEventListener('click', function () {
    var u = 'alipays://platformapi/startapp?saId=10000007&qrcode=' +
      encodeURIComponent('https://qr.alipay.com/fkx16052ou06vzy2xmzxj5f?_s=web-other');
    try {
      location.href = u;
    } catch (err) {}
  });

  function openSheet() {
    var checked = payable();
    if (checked.length === 0) return;
    var lines = CartLogic.computeLines(checked);   // 与 updateBar/render 同一套「共用优惠」口径
    var total = lines.reduce(function (s, l) { return s + l.lineFen; }, 0);
    el.payAmount.textContent = CartLogic.formatFen(total);
    el.payItems.innerHTML = checked.map(function (it, i) {
      var n = CartLogic.normalizeProduct(it);
      var line = lines[i];
      return '<div class="row"><span>' + esc(it.name || '未命名商品') + ' ×' + n.count + '</span>' +
        '<span' + (line.on ? ' class="off"' : '') + '>¥' + CartLogic.formatFen(line.lineFen) + '</span></div>';
    }).join('');
    el.mask.classList.add('show');
  }

  function closeSheet() { el.mask.classList.remove('show'); }

  // ---------- 工具 ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    el.toast.textContent = msg; el.toast.style.display = 'block';
    clearTimeout(toast._t); toast._t = setTimeout(function () { el.toast.style.display = 'none'; }, 1600);
  }

  // ---------- 初始化 ----------
  (function init() {
    items.forEach(function (it) {
      it.id = it.id || ('p' + (uid++));
      // 默认不勾选（由用户按需勾选后再结算）
    });
    render();
  })();
})();
</script>
</body>
</html>
